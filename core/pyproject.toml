[project]
name = "circuitsolver"
version = "0.1.0"
description = "Symbolic linear circuit analysis core (MNA on SymPy)"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "networkx>=3.0",
    "numpy>=1.26",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["circuitsolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
